# USD per 1M tokens, paid tier, text input. Source: https://ai.google.dev/gemini-api/docs/pricing
# Output prices include thinking tokens.
# A model missing here is logged with cost_usd null: the cost is never guessed.
models:
  gemini-3.5-flash-lite:
    input_per_million: 0.30
    output_per_million: 2.50
  gemini-3.1-flash-lite:
    input_per_million: 0.25
    output_per_million: 1.50
  gemini-3.6-flash:
    # Promotional price until 2026-12-31. From 2027-01-01: 1.50 input, 7.50 output.
    input_per_million: 0.75
    output_per_million: 3.75
