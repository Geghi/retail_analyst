services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
      POSTGRES_DB: analyst
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d analyst"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://analyst:analyst@db:5432/analyst
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp.json
    volumes:
      # Credentials stay outside the image: the secrets/ folder of this project, read-only.
      - ./secrets:/secrets:ro
      - ./logs:/app/logs
      - ./exports:/app/exports
    stdin_open: true
    tty: true

volumes:
  pgdata:
