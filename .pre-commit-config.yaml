default_install_hook_types: [pre-commit, post-checkout, post-rewrite]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: sync-deps
        name: re-install deps when a lockfile changed
        entry: scripts/sync-deps.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-checkout, post-rewrite]
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: system
        types: [python]
      - id: complexipy
        name: complexipy (failures only)
        entry: complexipy -f
        language: system
        types: [python]
