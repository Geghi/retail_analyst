default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: system
        types: [python]
      - id: complexipy
        name: complexipy (failures only)
        entry: complexipy -f
        language: system
        types: [python]
