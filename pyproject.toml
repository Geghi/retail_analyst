[project]
name = "retail-analyst"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests/support"]
testpaths = ["tests"]
markers = [
    "integration: needs docker compose db and/or live services",
    "acceptance: live end-to-end scenarios, spend quota, run only with -m acceptance",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tests/support"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/retail_analyst/agent/prompts.py" = ["E501"]  # prompt prose reads better unwrapped
