id: churned-customers
question: How many customers churned, with no non-cancelled order in the last 90 days, by traffic source?
queries:
  - |
    WITH last_order AS (
      SELECT user_id, MAX(created_at) AS last_order_at
      FROM `bigquery-public-data.thelook_ecommerce.orders`
      WHERE status != 'Cancelled'
      GROUP BY user_id
    )
    SELECT u.traffic_source,
           COUNT(*) AS customers,
           COUNTIF(l.last_order_at < TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 90 DAY)) AS churned,
           SAFE_DIVIDE(
             COUNTIF(l.last_order_at < TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 90 DAY)),
             COUNT(*)
           ) AS churn_rate
    FROM last_order l
    JOIN `bigquery-public-data.thelook_ecommerce.users` u ON u.id = l.user_id
    GROUP BY u.traffic_source
    ORDER BY churn_rate DESC
report: |
  Observed
  - Churn is a customer who ordered before but has no non-cancelled order in the last 90 days.
  - Churn rates differ by traffic source.

  Hypotheses (not verified)
  - Sources with high churn bring in price-driven first-time buyers.
  - The 90-day window is short for categories bought rarely.

  Actions
  - Shift acquisition budget toward sources with lower churn.
  - Run a win-back campaign on recently lapsed customers.
  - Test a longer window per category.
